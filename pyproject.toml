[project]
name = "mirsad-api"
version = "1.1.1"
description = "Local-first public content discovery and analysis API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135,<0.136",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.46,<1",
  "telethon>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
semantic = [
  "fastembed>=0.7,<0.8",
  "numpy>=2.1,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = [".", "apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
