<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MIRSAD Browser Capture</title>
    <style>
      body { width: 340px; margin: 0; padding: 16px; color: #172018; background: #f7f5ee; font: 14px/1.45 sans-serif; }
      h1 { margin: 0 0 12px; font: 600 17px/1.2 Georgia, serif; }
      label { display: block; margin-top: 10px; font-weight: 600; }
      input, textarea { box-sizing: border-box; width: 100%; margin-top: 4px; border: 1px solid #a6ada4; border-radius: 5px; padding: 8px; background: white; }
      textarea { min-height: 110px; resize: vertical; }
      button { width: 100%; margin-top: 12px; border: 0; border-radius: 5px; padding: 9px; color: white; background: #264f38; font-weight: 600; }
      p { margin: 8px 0 0; color: #556057; font-size: 12px; }
      #status { min-height: 18px; }
    </style>
  </head>
  <body>
    <h1>MIRSAD Browser Capture</h1>
    <label>Public URL<input id="url" type="url" readonly /></label>
    <label>Title<input id="title" type="text" maxlength="1000" /></label>
    <label>Selected visible text<textarea id="text" maxlength="20000" required></textarea></label>
    <button id="capture" type="button">Import selected item</button>
    <p>No cookies, credentials, background crawling, or page HTML are transferred.</p>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
